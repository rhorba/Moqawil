name: Deploy Preprod

# Sprint 13 — manual-only CI/CD pipeline test to a cheap preprod VPS.
# Not wired to push/PR on purpose: no staging branch exists yet, and this is a one-off pipeline
# test the owner triggers deliberately, not a continuous auto-deploy environment.
# See docs/preprod-deployment-moqawil.md for the owner-executed setup this depends on.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "master"
      wipe_data:
        description: "DESTRUCTIVE: truncate every app table on the preprod DB before deploying (fresh demo state). Never applies to self-host or any other environment."
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rhorba/moqawil-preprod

jobs:
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    environment: preprod
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve deploy tag (short SHA of the checked-out ref)
        id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (mirrors the self-host Dockerfile — same image, different label)
        uses: docker/build-push-action@v6
        with:
          context: moqawil
          file: moqawil/Dockerfile
          push: true
          # NEXT_PUBLIC_APP_URL is inlined into the client bundle at build time (webpack), unlike
          # every other env var here — docker-compose.preprod.yml's `environment:` block cannot
          # correct it after the fact. Must be the real preprod origin, not a placeholder.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://${{ secrets.PREPROD_APP_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:preprod-latest

  deploy:
    name: Deploy to preprod VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: preprod
    env:
      DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Configure SSH
        env:
          SSH_PORT: ${{ secrets.PREPROD_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.PREPROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.PREPROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Wipe preprod database (opt-in, destructive)
        # Only runs when explicitly requested via the workflow_dispatch `wipe_data` input --
        # never on a normal deploy. Truncates every app table (CASCADE handles FK ordering) so
        # the next sign-in lands on onboarding with a genuinely empty account, for a from-scratch
        # demo/walkthrough. Deliberately excludes drizzle's own migration-journal table (lives in
        # a separate `drizzle` schema, never named here) so migration history stays intact --
        # `pnpm db:migrate` in the Deploy step below remains a safe no-op replay, not a re-run.
        # Preprod is disposable test infrastructure with no real customer data (see
        # docs/preprod-deployment-moqawil.md) -- this is never wired to self-host or any
        # environment that could hold real invoices (CGI Article 211's 10-year retention rule
        # governs the app's own UI/actions, not this infra-level reset of a throwaway test box).
        if: ${{ inputs.wipe_data }}
        env:
          SSH_HOST: ${{ secrets.PREPROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PREPROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PREPROD_SSH_PORT }}
          APP_DIR: ${{ secrets.PREPROD_APP_DIR }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && docker compose -f docker-compose.preprod.yml exec -T postgres \
             sh -c 'psql -U \"\$POSTGRES_USER\" -d moqawil -c \"TRUNCATE TABLE users, accounts, sessions, verification_tokens, entrepreneurs, clients, invoices, invoice_lines, quotes, quote_lines, quarterly_declarations, accountant_links CASCADE;\"'"

      - name: Sync app secrets to VPS .env
        # GitHub Environment secrets are the source of truth for these app-level values -- this
        # step pushes them into the VPS's .env before every deploy, so rotating one in GitHub and
        # re-running this workflow is enough (no manual SSH + nano on the box). Values are
        # base64-encoded end-to-end so nothing about their content (quotes, `&`, etc.) can break
        # shell quoting on either side -- deliberately not the `${{ }}`-in-run: injection class
        # noted below either, since these are read from `env:` (real shell variables) not spliced
        # as raw text into the script. Empty secrets are skipped so unset ones don't blank out an
        # already-configured value on the box.
        env:
          SSH_HOST: ${{ secrets.PREPROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PREPROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PREPROD_SSH_PORT }}
          APP_DIR: ${{ secrets.PREPROD_APP_DIR }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          B64_GID=$(printf '%s' "$AUTH_GOOGLE_ID" | base64 -w0)
          B64_GSECRET=$(printf '%s' "$AUTH_GOOGLE_SECRET" | base64 -w0)
          B64_AUTH_URL=$(printf '%s' "$AUTH_URL" | base64 -w0)
          B64_RESEND=$(printf '%s' "$AUTH_RESEND_KEY" | base64 -w0)
          B64_SMTP_FROM=$(printf '%s' "$SMTP_FROM" | base64 -w0)
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' B64_GID='$B64_GID' B64_GSECRET='$B64_GSECRET' B64_AUTH_URL='$B64_AUTH_URL' B64_RESEND='$B64_RESEND' B64_SMTP_FROM='$B64_SMTP_FROM' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd "$APP_DIR"
          update_env() {
            key="$1"; val="$2"
            [ -z "$val" ] && return 0
            grep -v "^${key}=" .env > .env.tmp || true
            printf '%s=%s\n' "$key" "$val" >> .env.tmp
            mv .env.tmp .env
          }
          update_env AUTH_GOOGLE_ID "$(printf '%s' "$B64_GID" | base64 -d)"
          update_env AUTH_GOOGLE_SECRET "$(printf '%s' "$B64_GSECRET" | base64 -d)"
          update_env SMTP_FROM "$(printf '%s' "$B64_SMTP_FROM" | base64 -d)"
          update_env AUTH_URL "$(printf '%s' "$B64_AUTH_URL" | base64 -d)"
          update_env AUTH_RESEND_KEY "$(printf '%s' "$B64_RESEND" | base64 -d)"
          REMOTE_SCRIPT

      - name: Deploy (pull image + restart via the preprod compose file)
        # Security note: `inputs.ref` (workflow_dispatch, user-controlled) is deliberately never
        # interpolated into this or any other `run:` script body — GitHub Actions substitutes
        # `${{ }}` as raw text before bash parses the script, so doing that is a command-injection
        # vector (the runner would execute attacker-controlled text with GITHUB_TOKEN + this SSH
        # key in scope). `ref` is only ever used in `actions/checkout`'s `with:` field above, which
        # is a plain action parameter, not a shell string. The remote box always syncs its compose
        # config from `origin/master` (a fixed, non-attacker-controlled value); the actual app
        # version deployed is pinned precisely by DEPLOY_TAG (a computed git short-SHA, safe by
        # construction), not by re-deriving `ref` on the remote host.
        env:
          SSH_HOST: ${{ secrets.PREPROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PREPROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PREPROD_SSH_PORT }}
          APP_DIR: ${{ secrets.PREPROD_APP_DIR }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && \
             git fetch origin && \
             git reset --hard origin/master && \
             DEPLOY_TAG='$DEPLOY_TAG' docker compose -f docker-compose.preprod.yml pull web && \
             DEPLOY_TAG='$DEPLOY_TAG' docker compose -f docker-compose.preprod.yml up -d && \
             docker compose -f docker-compose.preprod.yml exec -T web pnpm db:migrate"

      - name: Health check (retries — container/HTTPS cert may need a moment on first deploy)
        env:
          PREPROD_APP_URL: ${{ secrets.PREPROD_APP_URL }}
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://$PREPROD_APP_URL/api/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $status, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
