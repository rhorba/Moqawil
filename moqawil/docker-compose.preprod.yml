# Preprod compose file for the Sprint 13 CI/CD pipeline test (.github/workflows/deploy-preprod.yml).
# Standalone on purpose (not a merge-override of docker-compose.yml): the only real difference is
# `web` uses a prebuilt GHCR image instead of building from source, so the deploy step doesn't
# have to compile Next.js on a minimum-tier VPS. Kept as a full file rather than a compose
# merge-override tag (`!reset`) so it runs on any Docker Compose v2 without a version floor.
#
# Self-host is completely unaffected — docker-compose.yml (build-from-source) is untouched.
#
# Usage on the preprod VPS:
#   DEPLOY_TAG=<git-sha> docker compose -f docker-compose.preprod.yml pull web
#   DEPLOY_TAG=<git-sha> docker compose -f docker-compose.preprod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moqawil
      POSTGRES_USER: ${POSTGRES_USER:-moqawil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moqawil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/rhorba/moqawil-preprod:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moqawil}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/moqawil
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://localhost}
    labels:
      caddy: ${APP_DOMAIN:-localhost}
      caddy.reverse_proxy: "{{upstreams 3000}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_INGRESS_NETWORKS: moqawil_default

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
